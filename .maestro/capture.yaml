appId: ${APP_ID}
tags:
  - opponent
---
# 1. e4 d5 2. exd5 - the shortest path to a capture, the opponent scripted
# to answer 1...d5. Proves tapping drives a capture on a real device; the
# rules themselves are unit-tested against ChessEngine.
- runFlow:
    file: common/to-board.yaml
    env:
      BOT_ARGS: "--guest --color b --moves d5 --delay 300"
- tapOn: { id: "square-e2" }
- tapOn: { id: "square-e4" }
- extendedWaitUntil:
    visible:
      id: "move-2"
      text: "d5"
    timeout: 10000
- tapOn: { id: "square-e4" }
- tapOn: { id: "square-d5" }
- extendedWaitUntil:
    visible:
      id: "move-3"
      text: "exd5"
    timeout: 5000
