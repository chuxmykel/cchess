# A new analysis from the Menu tab, a move for each side, then a different
# reply from the position before - kept as a variation - and the engine's
# first line (downloaded on first use, so this needs the internet, not the
# game server). Engine output varies, so only its presence is checked.
appId: host.exp.Exponent
---
- runFlow: common/launch-fresh.yaml
- tapOn:
    id: "menu-tab"
- tapOn:
    id: "analysis-new"
- tapOn:
    id: "square-e2"
- tapOn:
    id: "square-e4"
- tapOn:
    id: "square-e7"
- tapOn:
    id: "square-e5"
- assertVisible:
    id: "piece-e5"
- tapOn:
    id: "previous-move-button"
- assertVisible:
    id: "piece-e7"
- tapOn:
    id: "square-c7"
- tapOn:
    id: "square-c5"
- assertVisible:
    id: "piece-c5"
- assertVisible: "1... c5"
- assertVisible: "B20 · Sicilian Defense"
- extendedWaitUntil:
    visible:
      id: "engine-line-0"
    timeout: 30000
