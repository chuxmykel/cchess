appId: ${APP_ID}
tags:
  - account
  - engine
---
# A finished game's review, from Home's newest recent game - e2e_main's
# seeded blunder (6...Qxg5??, see cchess-be's e2e-fixtures seeder):
# analysed on the device (the engine downloaded first, a fresh launch
# having cleared it) - then, in the cchess style, its summary, the
# chapters, a guess at the turning point, Show, Best and stepping back. It never checks what the engine said, which varies.
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: "game-row-.*"
    timeout: 20000
- tapOn:
    id: "game-row-.*"
    index: 0
- tapOn:
    id: "review-button"
# The engine's download and the analysis: about a minute at most.
- extendedWaitUntil:
    visible:
      id: "game-review-summary"
    timeout: 180000
- assertVisible:
    id: "eval-graph"
# The cchess style, the default: the move that decided it, the game in
# chapters, then - further down - each side's accuracy and marks.
- assertVisible:
    id: "review-decisive"
- assertVisible:
    id: "review-chapter-0"
- scrollUntilVisible:
    element:
      id: "review-accuracy-w"
    direction: DOWN
- tapOn:
    id: "review-start"
- assertVisible:
    id: "review-bubble-title"
- assertVisible:
    id: "review-chapter-strip"
# On from chapter to chapter until it asks for e2e_main's move at the
# blunder's turning point.
- repeat:
    while:
      notVisible:
        id: "review-next"
        text: "Reveal"
    times: 6
    commands:
      - tapOn:
          id: "review-next"
- assertVisible:
    id: "review-bubble-title"
    text: "Your move"
# Revealed: the move played, marked, its line to Show and the Best move.
- tapOn:
    id: "review-next"
    text: "Reveal"
- tapOn:
    id: "review-show"
- assertVisible:
    id: "review-bubble-line"
- tapOn:
    id: "review-best"
- assertVisible:
    text: ".* · Best move"
# A move stepped back to is where the review is: Next plays on from there.
- tapOn:
    id: "review-back"
- assertVisible:
    id: "review-next"
    text: "Next"
