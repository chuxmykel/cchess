appId: ${APP_ID}
tags:
  - account
  - engine
---
# A finished game's review, from Home's newest recent game - e2e_main's
# seeded blunder (6...Qxg5??, see cchess-be's e2e-fixtures seeder):
# analysed on the device (the engine downloaded first, a fresh launch
# having cleared it) - then its summary, a key moment, Show, Best and
# stepping back. It never checks what the engine said, which varies.
- runFlow: common/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: "game-row-.*"
    timeout: 20000
- tapOn:
    id: "game-row-.*"
    index: 0
- tapOn:
    id: "review-button"
# The engine's download and the analysis: about a minute at most.
- extendedWaitUntil:
    visible:
      id: "game-review-summary"
    timeout: 180000
- assertVisible:
    id: "eval-graph"
- assertVisible:
    id: "review-accuracy-w"
- tapOn:
    id: "review-start"
- assertVisible:
    id: "review-bubble-title"
# On to the first key moment after the book.
- tapOn:
    id: "review-next"
- assertVisible:
    id: "review-board"
- tapOn:
    id: "review-show"
- assertVisible:
    id: "review-bubble-line"
- tapOn:
    id: "review-best"
- assertVisible:
    text: ".* is best"
# A move stepped back to is where the review is: Next plays on from there.
- tapOn:
    id: "review-back"
- assertVisible:
    id: "review-next"
    text: "Next"
