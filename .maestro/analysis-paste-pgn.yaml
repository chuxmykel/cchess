# Pasting a PGN from the Menu tab analyses its game, its opening named.
appId: ${APP_ID}
---
- runFlow: common/launch-fresh.yaml
- tapOn:
    id: "menu-tab"
    retryTapIfNoChange: true
- tapOn:
    id: "analysis-paste"
    retryTapIfNoChange: true
- tapOn:
    id: "paste-game-input"
- inputText: "1. e4 e5 2. Nf3 Nc6 3. Bb5"
- runFlow:
    file: common/typed.yaml
    env:
      FIELD: "paste-game-input"
      TEXT: "1. e4 e5 2. Nf3 Nc6 3. Bb5"
# Analyse is pinned above the keyboard, so there's no closing it first -
# on Android that's a back press, which leaves the screen when no
# on-screen keyboard is up.
- tapOn:
    id: "paste-game-analyse"
- assertVisible:
    id: "analysis-board"
- assertVisible: ".*Ruy Lopez.*"
