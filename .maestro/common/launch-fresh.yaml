appId: host.exp.Exponent
---
# Guarantees a genuinely fresh app + a new game: clearState wipes Expo Go's
# remembered project list (so openLink can't just resume an already-running
# JS instance), and the dev-menu overlay only reappears on a true fresh
# load - its presence is itself a signal this worked, which is why every
# flow dismisses it explicitly rather than assuming it's absent.
#
# Requires `expo start` already running locally on the default port 8081 -
# see ../README.md.
- launchApp:
    clearState: true
- openLink: "exp://127.0.0.1:8081"

# The first-launch dev-menu overlay has both an "X" (id: xmark) and a
# "Continue" button. Tap the X to close the overlay.
- tapOn:
    id: "xmark"

# Synchronization barrier: tapOn/swipe don't wait for the board to actually
# be interactive, only for the dev-menu overlay's dismissal to register -
# without this, flows that immediately start tapping squares race ahead of
# the board settling and silently miss (this bit every flow below the first
# one that didn't itself open with an assertion).
- assertVisible:
    id: "piece-e2"
