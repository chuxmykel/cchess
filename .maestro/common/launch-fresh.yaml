appId: ${APP_ID}
---
# Guarantees a genuinely fresh app, landing on Home as a new guest:
# clearState wipes Expo Go's remembered project list (so openLink can't
# just resume an already-running JS instance) and, on Android, the stored
# account; iOS keeps that in the keychain, cleared here too. A flow that
# needs an account signs in afterwards (sign-in.yaml).
#
# Every flow starts here, after stopping any scripted opponent an earlier
# flow left running (bot-reset.js).
#
# Run through scripts/e2e/run.sh, which sets APP_ID (Expo Go's, per
# platform), METRO_URL (its Metro, on 8091 so it's clear of a dev one)
# and BOT_URL - see ../README.md.
- runScript: bot-reset.js
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
# As `expo start` does when it opens a project itself:
# __expo_disable_onboarding keeps Expo Go's first-launch dev-menu overlay
# away, and __expo_disable_fab its floating dev-menu button - drawn over the
# app's top right corner, where it takes taps meant for a header's buttons.
# On iOS, through the bot server, which opens it without waiting: Maestro's
# openLink waits on `simctl openurl`, which a slow simulator (CI's) times
# out (POSIX error 60) - on its "Open in Expo Go?" prompt, answered below,
# or on Expo Go loading - failing the flow, `optional` or not. Should it
# really not have opened, Home never shows, and the wait below fails it.
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: "${METRO_URL}?__expo_disable_onboarding=1&__expo_disable_fab=1"
- runFlow:
    when:
      platform: iOS
    commands:
      - runScript:
          file: open-link.js
          env:
            LINK: "${METRO_URL}?__expo_disable_onboarding=1&__expo_disable_fab=1"

# Until Home shows - the first launch of a run also waits here on Expo Go
# building the bundle, minutes on a slow simulator (CI's) - closing Expo
# Go's dev menu should it open over the app: with its X, `xmark`, on iOS,
# or the one labelled "Close" on Android. Never "Continue", which opens
# the dev tools menu over the app instead. And Wait on an Android "isn't
# responding" dialog (see below).
- repeat:
    while:
      notVisible:
        id: "play-button"
    times: 45
    commands:
      - extendedWaitUntil:
          visible:
            id: "play-button"
          timeout: 3000
          optional: true
      # A fresh simulator (CI's) asks before it first opens an exp:// link:
      # "Open in “Expo Go”?" - until it's answered, nothing loads.
      - tapOn:
          text: "Open"
          optional: true
      - tapOn:
          id: "xmark"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - tapOn:
          text: "Wait"
          optional: true

# Android's Expo Go opens its dev menu once the app has loaded, over Home:
# give it a moment to, and close it. And a slow emulator can show a system
# app's "isn't responding" dialog over everything (run.sh turns them off,
# which Android doesn't always heed): Wait lets it carry on.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Wait"
          optional: true
      - extendedWaitUntil:
          visible:
            text: "Close"
          timeout: 4000
          optional: true
      - tapOn:
          text: "Close"
          optional: true

# Synchronization barrier: tapOn/swipe don't wait for Home to actually be
# interactive, only for Maestro's own target element to resolve - without
# this, a flow that starts interacting immediately after this one races
# ahead of Home settling and silently misses.
- extendedWaitUntil:
    visible:
      id: "play-button"
    timeout: 10000
