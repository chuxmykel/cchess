appId: ${APP_ID}
---
# Guarantees a genuinely fresh app, landing on Home as a new guest:
# clearState wipes Expo Go's remembered project list (so openLink can't
# just resume an already-running JS instance) and, on Android, the stored
# account; iOS keeps that in the keychain, cleared here too. A flow that
# needs an account signs in afterwards (sign-in.yaml).
#
# Every flow starts here, after stopping any scripted opponent an earlier
# flow left running (bot-reset.js).
#
# Run through scripts/e2e/run.sh, which sets APP_ID (Expo Go's, per
# platform), METRO_URL (its Metro, on 8091 so it's clear of a dev one)
# and BOT_URL - see ../README.md.
- runScript: bot-reset.js
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
# As `expo start` does when it opens a project itself:
# __expo_disable_onboarding keeps Expo Go's first-launch dev-menu overlay
# away, and __expo_disable_fab its floating dev-menu button - drawn over the
# app's top right corner, where it takes taps meant for a header's buttons.
# On iOS, through the bot server, which opens it without waiting: Maestro's
# openLink waits on `simctl openurl`, which a slow simulator (CI's) times
# out (POSIX error 60) - on its "Open in Expo Go?" prompt, answered below,
# or on Expo Go loading - failing the flow, `optional` or not. Should it
# really not have opened, Home never shows, and the wait below fails it.
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: "${METRO_URL}?__expo_disable_onboarding=1&__expo_disable_fab=1"
- runFlow:
    when:
      platform: iOS
    commands:
      - runScript:
          file: open-link.js
          env:
            LINK: "${METRO_URL}?__expo_disable_onboarding=1&__expo_disable_fab=1"

# Until Home shows - the first launch of a run also waits here on Expo Go
# building the bundle, minutes on a slow simulator (CI's) - closing
# whatever covers it: Expo Go's dev menu (its X, `xmark`, on iOS, or the
# one labelled "Close" on Android - never "Continue", which opens the dev
# tools menu over the app instead); a fresh simulator's "Open in “Expo
# Go”?", until answered nothing loads; and an Android "isn't responding"
# dialog (see below). Each tapped only once it's seen there: an optional
# tap waits seconds for what's missing, every round, every flow.
- repeat:
    while:
      notVisible:
        id: "play-button"
    times: 60
    commands:
      - extendedWaitUntil:
          visible:
            id: "play-button"
          timeout: 3000
          optional: true
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
      - runFlow:
          when:
            visible:
              id: "xmark"
          commands:
            - tapOn:
                id: "xmark"
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - runFlow:
          when:
            visible: "Wait"
          commands:
            - tapOn: "Wait"
      # "Could not connect to development server": a busy runner's Metro
      # took longer over the bundle than Expo Go waits. Ask again.
      - runFlow:
          when:
            visible: "Reload \\(⌘R\\)"
          commands:
            - tapOn: "Reload \\(⌘R\\)"

# Android's Expo Go can open its dev menu once the app has loaded, over
# Home: give it a moment to, and close it. And a slow emulator can show a
# system app's "isn't responding" dialog over everything (run.sh turns them
# off, which Android doesn't always heed): Wait lets it carry on.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible: "Wait"
          commands:
            - tapOn: "Wait"
      - extendedWaitUntil:
          visible: "Close"
          timeout: 4000
          optional: true
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"

# Synchronization barrier: tapOn/swipe don't wait for Home to actually be
# interactive, only for Maestro's own target element to resolve - without
# this, a flow that starts interacting immediately after this one races
# ahead of Home settling and silently misses.
- extendedWaitUntil:
    visible:
      id: "play-button"
    timeout: 10000
# And then settled: on a slow simulator (CI's) Home shows a while before it
# takes taps, as it loads, and a flow's first tap went missing.
- waitForAnimationToEnd:
    timeout: 5000
