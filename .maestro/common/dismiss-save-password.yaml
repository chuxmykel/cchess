appId: ${APP_ID}
---
# iOS offers to save a password whenever a filled-in password form goes
# away (after Sign in or Create account): close it with "Not Now". Which
# way depends on iOS, as scripts/e2e/run.sh says in SAVE_PASSWORD - one
# way only, as the other would tap Home:
# - card (iOS 26, CI's): Maestro sees it, so it's waited for and tapped
#   by its text - it comes a while after the form goes, longer on a slow
#   simulator;
# - sheet (iOS 27): missing from Maestro's hierarchy, so it's tapped by
#   point - Not Now on the iPhone 18 Pro - a moment after the form goes.
# Android offers nothing in Expo Go (none).
- runFlow:
    when:
      true: ${SAVE_PASSWORD == 'card'}
    commands:
      - extendedWaitUntil:
          visible:
            text: "Not Now"
          timeout: 10000
          optional: true
      - tapOn:
          text: "Not Now"
          optional: true
      - waitForAnimationToEnd
- runFlow:
    when:
      true: ${SAVE_PASSWORD == 'sheet'}
    commands:
      # Waits that moment, for something that's never there.
      - extendedWaitUntil:
          visible:
            id: "never-there"
          timeout: 1500
          optional: true
      - tapOn:
          point: "127,546"
      - waitForAnimationToEnd
