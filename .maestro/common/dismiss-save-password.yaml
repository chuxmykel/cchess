appId: ${APP_ID}
---
# iOS offers to save a password whenever a filled-in password form goes
# away (after Sign in or Create account): close its "Not Now". The prompt is
# iOS's own, missing from Maestro's hierarchy, so it's tapped by point -
# Not Now on the iPhone 18 Pro - harmless when it isn't showing. Android offers nothing in Expo Go.
- runFlow:
    when:
      platform: iOS
    commands:
      # It slides in a moment after the form goes, unseen by Maestro: wait
      # that moment (for something that's never there) before tapping.
      - extendedWaitUntil:
          visible:
            id: "never-there"
          timeout: 1500
          optional: true
      - tapOn:
          point: "127,546"
      - waitForAnimationToEnd
