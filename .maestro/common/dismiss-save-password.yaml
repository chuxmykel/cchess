appId: ${APP_ID}
---
# iOS offers to save a password whenever a filled-in password form goes
# away (after Sign in or Create account): close it with "Not Now". iOS 26
# (CI's) shows it as a card Maestro can see, and it's tapped by its text;
# iOS 27's sheet is missing from Maestro's hierarchy, so there it's tapped
# by point - Not Now on the iPhone 18 Pro (on 26's card too). Either comes
# a while after the form goes, longer on a slow simulator: wait for it
# before tapping. Android offers nothing in Expo Go.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "Not Now"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              text: "Not Now"
          commands:
            - tapOn:
                text: "Not Now"
      - runFlow:
          when:
            notVisible:
              text: "Not Now"
          commands:
            - tapOn:
                point: "127,546"
      - waitForAnimationToEnd
