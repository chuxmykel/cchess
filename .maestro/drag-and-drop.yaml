appId: ${APP_ID}
tags:
  - opponent
---
# A move by dragging the pawn from e2 to e4. A swipe can't be aimed by
# testID, so its ends are the squares' centres on each platform's pinned
# device: points on the iPhone 18 Pro, pixels on the Pixel 8 (see
# README.md, "Device-specific coordinates").
- runFlow: common/to-board.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: "607,1577"
          end: "607,1307"
          duration: 600
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "226,587"
          end: "226,486"
          duration: 600
- extendedWaitUntil:
    visible:
      id: "move-1"
      text: "e4"
    timeout: 5000
