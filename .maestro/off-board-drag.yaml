appId: ${APP_ID}
tags:
  - opponent
---
# A knight dragged off the board goes home, no move made - and can still be
# moved after. Points are per platform: see drag-and-drop.yaml.
- runFlow: common/to-board.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: "877,1712"
          end: "877,1990"
          duration: 600
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "326,637"
          end: "326,770"
          duration: 600
- assertNotVisible:
    id: "move-1"
- tapOn: { id: "square-g1" }
- tapOn: { id: "square-f3" }
- extendedWaitUntil:
    visible:
      id: "move-1"
      text: "Nf3"
    timeout: 5000
