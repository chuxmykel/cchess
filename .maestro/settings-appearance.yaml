appId: ${APP_ID}
---
# Appearance, from the Menu's Settings: a color theme - its board with it -
# and dark mode chosen, and still chosen after the app is closed and opened
# again - they're kept on the device.
- runFlow: common/launch-fresh.yaml
- tapOn:
    id: "menu-tab"
    retryTapIfNoChange: true
- tapOn:
    id: "menu-settings"
    retryTapIfNoChange: true
- tapOn:
    id: "appearance-row"
- tapOn:
    id: "color-theme-violet"
- runFlow:
    file: common/assert-checked.yaml
    env:
      ID: color-theme-violet
- runFlow:
    file: common/assert-checked.yaml
    env:
      ID: board-theme-lavender
- tapOn:
    id: "color-scheme-dark"
- runFlow:
    file: common/assert-checked.yaml
    env:
      ID: color-scheme-dark
- stopApp
- launchApp
- runFlow: common/open-app.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "Close"
          timeout: 15000
          optional: true
      - tapOn:
          text: "Close"
          optional: true
- extendedWaitUntil:
    visible:
      id: "play-button"
    timeout: 30000
- tapOn:
    id: "menu-tab"
    retryTapIfNoChange: true
- tapOn:
    id: "menu-settings"
    retryTapIfNoChange: true
- tapOn:
    id: "appearance-row"
- runFlow:
    file: common/assert-checked.yaml
    env:
      ID: color-scheme-dark
- runFlow:
    file: common/assert-checked.yaml
    env:
      ID: color-theme-violet
