# The tabs as a guest: Puzzles opens on its home (a guest has a puzzle
# rating too), Messages asks to sign in (a guest has no friends to
# message), and the Menu opens the settings.
appId: ${APP_ID}
---
- runFlow: common/launch-fresh.yaml
- tapOn:
    id: "puzzles-tab"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "puzzle-rating"
    timeout: 10000
- assertVisible:
    id: "puzzles-mine"
- tapOn:
    id: "messages-tab"
    retryTapIfNoChange: true
- assertVisible:
    id: "messages-screen"
- assertVisible:
    id: "sign-in-prompt"
- tapOn:
    id: "menu-tab"
    retryTapIfNoChange: true
- assertVisible:
    id: "analysis-new"
- tapOn:
    id: "menu-settings"
    retryTapIfNoChange: true
- assertVisible:
    id: "settings-screen"
