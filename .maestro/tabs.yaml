# The tabs as a guest: Messages asks to sign in (a guest has no friends to
# message), and the Menu opens the settings. Puzzles is hidden until it's
# built (src/constants/features.ts).
appId: ${APP_ID}
---
- runFlow: common/launch-fresh.yaml
- assertNotVisible:
    id: "puzzles-tab"
- tapOn:
    id: "messages-tab"
    retryTapIfNoChange: true
- assertVisible:
    id: "messages-screen"
- assertVisible:
    id: "sign-in-prompt"
- tapOn:
    id: "menu-tab"
    retryTapIfNoChange: true
- assertVisible:
    id: "analysis-new"
- tapOn:
    id: "menu-settings"
    retryTapIfNoChange: true
- assertVisible:
    id: "settings-screen"
