appId: host.exp.Exponent
---
# "Challenge a Friend" and "Play Stockfish" look disabled but still respond
# to a tap, showing a "Coming soon" toast via a separate onDisabledPress
# path rather than the button's real onPress (see Button's appearsDisabled
# prop). The assertion has to land in the same flow run right after the
# tap - the toast auto-dismisses after 2s (see useToast's DEFAULT_DURATION_MS),
# and a screenshot taken via a separate, slower shell round-trip can miss
# that window entirely even though the feature works correctly.
- runFlow: common/to-new-game.yaml

- tapOn:
    id: "challenge-friend-button"
- assertVisible:
    text: "Coming soon"

- tapOn:
    id: "play-stockfish-button"
- assertVisible:
    text: "Coming soon"
