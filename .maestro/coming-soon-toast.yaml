appId: ${APP_ID}
---
# New Game's two lower buttons look disabled but still answer a tap, with
# a toast through a separate onDisabledPress path rather than the button's
# real onPress (see Button's appearsDisabled prop): "Challenge a Friend"
# asks a guest to sign in, and "Play Stockfish" isn't there yet. Each
# assertion has to land in the same flow run right after its tap - the
# toast goes after 2s (see useToast's DEFAULT_DURATION_MS).
- runFlow: common/to-new-game.yaml

- tapOn:
    id: "challenge-friend-button"
- assertVisible:
    text: "Sign in to challenge friends."

- tapOn:
    id: "play-stockfish-button"
- assertVisible:
    text: "Coming soon"
