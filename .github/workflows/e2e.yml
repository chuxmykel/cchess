name: E2E

# The Maestro suite on both platforms, against a real cchess-be: every flow,
# split into shards run side by side. scripts/e2e/run.sh does the work -
# the backend, the device, Metro, the bots, the flows - on CI as locally.
on:
  push:
    branches: [main, develop]
  pull_request:
  # Run by hand from the Actions tab - while fixing a failure, just the
  # flows in question, on one platform, in minutes rather than the hour.
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [both, android, ios]
        default: both
      flows:
        description: Flows, space-separated (all of them if empty)
        type: string
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.10.0
  # The flows to run - empty, all of them - through env, not the script's
  # text, so what's typed in can't become a command.
  E2E_FLOWS: ${{ inputs.flows }}

jobs:
  android:
    name: Android (shard ${{ matrix.shard }}/6)
    if: inputs.platform != 'ios'
    # Docker for the backend's stack (cchess-infra's, the image production
    # runs) and KVM for the emulator: Linux has both.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux runners are free and plentiful: six, so a shard is done in
        # a quarter of an hour or so.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          path: cchess
      # The backend, beside the app as run.sh expects - from develop. Private
      # repos need a token that can read them, as these secrets.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cchess-be
          ref: develop
          path: cchess-be
          token: ${{ secrets.CCHESS_BE_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cchess-infra
          ref: develop
          path: cchess-infra
          token: ${{ secrets.CCHESS_INFRA_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: cchess/.nvmrc
          cache: npm
          cache-dependency-path: cchess/package-lock.json
      - run: npm ci
        working-directory: cchess

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Metro's transform cache, so the first bundle doesn't take minutes:
      # each run saves its own, and restores the newest.
      - name: Cache Metro
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/metro
          key: metro-${{ runner.os }}-${{ hashFiles('cchess/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            metro-${{ runner.os }}-${{ hashFiles('cchess/package-lock.json') }}-
            metro-${{ runner.os }}-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the emulator
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-pixel_8-x86_64

      - name: Make the emulator's snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_8
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot made."

      # The same Pixel 8 as the cchess-e2e emulator used locally, so the
      # flows' points on it hold.
      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_METRO_TMPDIR: ${{ runner.temp }}/metro
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_8
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: cchess
          # A Maestro session of its own every six flows: on a hosted runner
          # the emulator drops off adb a quarter of an hour or so in.
          script: E2E_MAESTRO_BATCH=6 scripts/e2e/run.sh --platform android --backend docker --shard ${{ matrix.shard }}/6 $E2E_FLOWS

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-${{ matrix.shard }}
          path: cchess/.e2e-logs
          # upload-artifact leaves out what's hidden unless told: all of it is.
          include-hidden-files: true
          if-no-files-found: ignore

  ios:
    name: iOS (shard ${{ matrix.shard }}/5)
    if: inputs.platform != 'android'
    # The simulator needs macOS, whose runners have no Docker: cchess-be
    # runs directly instead (scripts/e2e/backend-native.sh), on Postgres
    # 18 as production's is.
    runs-on: macos-26
    # Five shards, the most macOS jobs a free account runs at once: an iOS
    # flow takes minutes on a hosted runner, and a long simulator session
    # grows likelier to lose Maestro's driver.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          path: cchess
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cchess-be
          ref: develop
          path: cchess-be
          token: ${{ secrets.CCHESS_BE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: cchess/.nvmrc
          cache: npm
          cache-dependency-path: cchess/package-lock.json
      - run: npm ci
        working-directory: cchess
      # cchess-be runs on its own Node, as its .nvmrc says.
      - uses: actions/setup-node@v4
        with:
          node-version-file: cchess-be/.nvmrc
          cache: npm
          cache-dependency-path: cchess-be/package-lock.json
      - run: npm ci
        working-directory: cchess-be

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Metro's transform cache, so the first bundle doesn't take minutes:
      # each run saves its own, and restores the newest.
      - name: Cache Metro
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/metro
          key: metro-${{ runner.os }}-${{ hashFiles('cchess/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            metro-${{ runner.os }}-${{ hashFiles('cchess/package-lock.json') }}-
            metro-${{ runner.os }}-

      - name: Start Postgres
        run: |
          brew install postgresql@18
          pg="$(brew --prefix postgresql@18)/bin"
          echo "$pg" >> "$GITHUB_PATH"
          "$pg/initdb" -D "$RUNNER_TEMP/pg" -U runner --auth=trust >/dev/null
          "$pg/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -w start
          {
            echo "PGHOST=127.0.0.1"
            echo "PGUSER=runner"
            echo "PGDATABASE=postgres"
          } >> "$GITHUB_ENV"

      # The flows' iOS points are for the iPhone 18 Pro used locally; the
      # 17 Pro, the newest on this image (Xcode 26, iOS 26), is the same
      # size, 402x874.
      # Metro runs on cchess-be's Node too, set up last: newer than the
      # app's pin, which is for its lint tooling.
      - name: Run the flows
        working-directory: cchess
        env:
          E2E_IOS_DEVICE: iPhone 17 Pro
          # Maestro's driver - an XCTest runner it builds and starts on the
          # simulator - takes minutes on a hosted runner (past four, at
          # times), against its default wait of seconds.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 480000
          # A Maestro session of its own every four flows: on a hosted
          # runner its iOS driver stops answering twenty minutes or so in.
          E2E_MAESTRO_BATCH: 4
          E2E_METRO_TMPDIR: ${{ runner.temp }}/metro
        run: |
          # shellcheck disable=SC2086 # E2E_FLOWS is a list of flows
          scripts/e2e/run.sh --platform ios --backend native --shard ${{ matrix.shard }}/5 $E2E_FLOWS

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-${{ matrix.shard }}
          path: cchess/.e2e-logs
          # upload-artifact leaves out what's hidden unless told: all of it is.
          include-hidden-files: true
          if-no-files-found: ignore

  # One check for branch protection to require: every shard on both - or,
  # run by hand for one platform, the other skipped.
  e2e:
    name: E2E
    if: always()
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - env:
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          for result in "$ANDROID" "$IOS"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
