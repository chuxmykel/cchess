# Closes iOS's "Save Password?" prompt, which appears whenever a filled-in
# password form goes away (after Create account or Sign in, or leaving one
# with the back button). The prompt belongs to iOS, not the app, so it's
# missing from Maestro's hierarchy and screenshots - tap "Not Now" by
# point. Harmless when the prompt isn't showing.
appId: host.exp.Exponent
---
- waitForAnimationToEnd
- tapOn:
    point: "127,546"
- waitForAnimationToEnd
