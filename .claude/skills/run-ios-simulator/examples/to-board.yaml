# Fresh launch -> New Game -> Start New Game, then wait for a matched live
# game. Needs cchess-be running and an opponent seeking the same time
# control (default 5+0) - start `npm run opponent` before or while this
# runs (see SKILL.md, "Getting into a live game").
#
# Run with: maestro --device <UDID> test to-board.yaml
appId: host.exp.Exponent
---
- runFlow: to-new-game-and-seek.yaml
- extendedWaitUntil:
    visible:
      id: "flip-board-button"
    timeout: 20000
