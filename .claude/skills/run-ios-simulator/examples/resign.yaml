# Resign the current live game with the toolbar's ⚑ and wait for the
# game-over card. The opponent script exits by itself once the game is
# over. ⚑ is only enabled once both sides have moved - before that, use
# abort.yaml.
#
# The alert's "Resign" is tapped by point: `tapOn: "Resign"` matches the
# toolbar's ⚑ instead (its accessibility label is also "Resign"), leaving
# the alert open. The point is the alert's right-hand button on iPhone 18
# Pro / iOS 27.0.
#
# Run with: maestro --device <UDID> test resign.yaml
appId: host.exp.Exponent
---
- tapOn:
    id: "toolbar-resign-button"
- extendedWaitUntil:
    visible:
      text: "You will lose this game."
    timeout: 5000
- tapOn:
    point: "275,487"
- extendedWaitUntil:
    visible:
      id: "game-over-card"
    timeout: 10000
